<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Post Announcement</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        :root { --bg:#f7f7fb; --card:#fff; --border:#e5e7eb; --text:#111827; --muted:#6b7280; --accent:#27ae60; }
        * { box-sizing: border-box; }
        body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; background:var(--bg); color:var(--text); }
        .wrap { max-width:720px; margin:40px auto; padding:0 16px; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; box-shadow:0 2px 10px rgba(0,0,0,.04); }
        h1 { margin:0 0 14px; font-size:1.25rem; }
        label { display:block; font-weight:600; margin:12px 0 6px; }
        input[type="text"], input[type="password"], input[type="number"], input[type="email"], textarea {
            width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font:inherit; background:#fff;
        }
        textarea { min-height:140px; resize:vertical; }
        .row { display:flex; gap:12px; }
        .row > div { flex:1; }
        .muted { color:var(--muted); font-size:.9rem; }
        button {
            border:0; padding:10px 14px; border-radius:10px; font-weight:700; cursor:pointer;
            background:var(--accent); color:white; margin-top:14px;
        }
        .out { margin-top:16px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:#0b1220; color:#e5e7eb; padding:14px; border-radius:10px; white-space:pre-wrap; }
        .ok { color:#059669; }
        .err { color:#dc2626; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h1>Post Announcement</h1>
        <form id="annForm">
            <div class="row">
                <div>
                    <label for="title">Title</label>
                    <input id="title" name="title" type="text" required placeholder="Title" />
                </div>
                <div>
                    <label for="expire">Expire (hours)</label>
                    <input id="expire" name="expire" type="number" min="0" step="1" placeholder="Expire time" required />
                </div>
            </div>

            <label for="body">Body</label>
            <textarea id="body" name="body" required placeholder="Announcement text…"></textarea>

            <button type="submit">Send</button>
            <div id="status" class="muted" style="margin-top:8px;"></div>
        </form>

        <div id="output" class="out" style="display:none;"></div>
    </div>

	<div class="card" style="margin-top:18px;">
		<h1>Email list</h1>
		<form id="emailForm">
			<label for="email">Add an email address</label>
			<div class="row">
				<div><input id="email" name="email" type="email" required placeholder="name@example.com" /></div>
				<button type="submit" style="margin-top:0;">Add</button>
			</div>
			<div id="emailStatus" class="muted" style="margin-top:8px;"></div>
		</form>
		<ul id="emailList" class="muted"></ul>
	</div>
</div>

<script>
    const form = document.getElementById('annForm');
    const statusEl = document.getElementById('status');
    const outEl = document.getElementById('output');
	const emailForm = document.getElementById('emailForm');
	const emailStatus = document.getElementById('emailStatus');
	const emailList = document.getElementById('emailList');

	function renderEmails(emails) {
		emailList.replaceChildren(...emails.map(email => {
			const item = document.createElement('li');
			item.textContent = email;
			return item;
		}));
		if (!emails.length) emailList.textContent = 'No email addresses have been added.';
	}

	async function loadEmails() {
		try {
			const response = await fetch('/jna-emails', { credentials: 'same-origin', cache: 'no-store' });
			if (!response.ok) throw new Error(await response.text());
			renderEmails(await response.json());
		} catch (error) {
			emailStatus.textContent = `Could not load email list: ${error}`;
		}
	}

	emailForm.addEventListener('submit', async (event) => {
		event.preventDefault();
		emailStatus.textContent = 'Adding...';
		try {
			const response = await fetch('/jna-emails', {
				method: 'POST',
				headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
				body: new URLSearchParams({ email: document.getElementById('email').value }),
				credentials: 'same-origin'
			});
			const result = await response.json().catch(() => ({}));
			if (!response.ok) {
				emailStatus.textContent = result.error || 'Could not add email address.';
				return;
			}
			document.getElementById('email').value = '';
			emailStatus.textContent = 'Email address added.';
			renderEmails(result);
		} catch (error) {
			emailStatus.textContent = `Could not add email address: ${error}`;
		}
	});

	loadEmails();


    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        statusEl.textContent = 'Sending…';
        outEl.style.display = 'none';
        outEl.textContent = '';

        const title = document.getElementById('title').value;
        const body = oneLine(document.getElementById('body').value);
        const expire = String(parseInt(document.getElementById('expire').value, 10) || 0);

        try {
            const res = await fetch('/jnau', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
                },
                body: new URLSearchParams({
                    title: title,
                    body,
                    expire
                }),
                credentials: 'same-origin',
                cache: 'no-store'
            });

            const text = await res.text().catch(() => '');
            if (res.ok) {
                document.getElementById('title').value = ""
                document.getElementById('body').value = ""
                document.getElementById('expire').value = ""
            }
            statusEl.innerHTML = res.ok
                ? `<span class="ok">Success</span> (HTTP ${res.status})`
                : `<span class="err">Failed</span> (HTTP ${res.status})`;
            outEl.style.display = 'block';
            outEl.textContent = text || '(empty response body)';
        } catch (err) {
            statusEl.innerHTML = `<span class="err">Network error</span>`;
            outEl.style.display = 'block';
            outEl.textContent = String(err);
        }
    });
</script>
</body>
</html>
