<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <style>
        :root { color-scheme: light; --bg:#f7f7fb; --card:#fff; --border:#e5e7eb; --text:#111827; --muted:#6b7280; --accent:#198754; --error:#b91c1c; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
        main { width:min(100%, 460px); padding:28px; border:1px solid var(--border); border-radius:14px; background:var(--card); box-shadow:0 8px 30px rgba(0,0,0,.06); }
        h1 { margin:0 0 8px; font-size:1.5rem; }
        p { margin:0 0 22px; color:var(--muted); }
        label { display:block; margin-bottom:8px; font-weight:650; }
        input[type="file"] { width:100%; padding:12px; border:1px solid var(--border); border-radius:9px; background:#fff; }
        button { width:100%; margin-top:18px; padding:11px 14px; border:0; border-radius:9px; background:var(--accent); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
        .error { margin-bottom:18px; padding:10px 12px; border-radius:8px; background:#fef2f2; color:var(--error); }
    </style>
</head>
<body>
<main>
    <h1>Login required</h1>
    <p>Upload the text file containing your access key.</p>
    {{ if .error }}<div class="error" role="alert">{{ .error }}</div>{{ end }}
    <form action="/login" method="post" enctype="multipart/form-data">
        <input type="hidden" name="next" value="{{ .next }}">
        <label for="key">Key file</label>
        <input id="key" name="key" type="file" accept=".txt,text/plain" required>
        <button type="submit">Verify key</button>
    </form>
</main>
</body>
</html>
